global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
  - job_name: linux
    static_configs:
      - targets: ['192.168.77.100:9100']
  - job_name: windows
    static_configs:
      - targets: ['192.168.77.30:9182']
  - job_name: cadvisor
    static_configs:
      - targets: ['127.0.0.1:8080']
  - job_name: web
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://192.168.77.100']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
